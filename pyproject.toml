[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screaming-frog-mcp"
version = "1.0.0"
description = "Drive the Screaming Frog SEO Spider from any MCP client: headless crawls, a ranked issue register, derived analysis and a shareable report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Shahid" }]
keywords = ["mcp", "seo", "screaming-frog", "crawler", "site-audit", "technical-seo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
screaming-frog-mcp = "screaming_frog_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mshahiddigital/screaming-frog-mcp"
Issues = "https://github.com/mshahiddigital/screaming-frog-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/screaming_frog_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
