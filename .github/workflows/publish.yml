name: Publish to PyPI

# Trusted Publishing: PyPI authenticates this workflow by identity (OIDC), so
# there is no API token to create, store as a secret, or leak. PyPI must be
# configured once to trust:
#   owner mshahiddigital / repo screamingfrog-audit-mcp
#   workflow publish.yml / environment pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Never publish something the test suite has not passed.
      - name: Test what is about to ship
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
